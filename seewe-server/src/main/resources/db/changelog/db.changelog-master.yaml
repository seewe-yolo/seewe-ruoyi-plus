databaseChangeLog:
  # MySQL
  # Core system module. Keep enabled because optional modules depend on sys_menu.
  - include:
      file: db/changelog/mysql/ry_vue_table.sql
  - include:
      file: db/changelog/mysql/ry_vue_data.sql

  # Job scheduling module. Comment both entries to remove its tables and menu.
  - include:
      file: db/changelog/mysql/ry_job_table.sql
  - include:
      file: db/changelog/mysql/ry_job_data.sql

  # Workflow module. Comment both entries to remove its tables and menu.
  - include:
      file: db/changelog/mysql/ry_workflow_table.sql
  - include:
      file: db/changelog/mysql/ry_workflow_data.sql

  # AI module. Uncomment both entries to create its tables and menus.
#  - include:
#      file: db/changelog/mysql/ry_ai_table.sql
#  - include:
#      file: db/changelog/mysql/ry_ai_data.sql
  - includeAll:
      path: db/changelog/mysql/changes
      relativeToChangelogFile: false
      errorIfMissingOrEmpty: false

